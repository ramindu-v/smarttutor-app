<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTutor - Notifications</title>
    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <main class="main-content">
        <div class="top-bar">
            <div class="flex-grow-1">
                <h4 id="pageTitle">Notifications</h4>
                <small class="text-muted" id="pageSubtitle">Schedule changes, attendance alerts, payment reminders and announcements</small>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-7">
                <div class="card-box">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0"><i class="far fa-bell me-2"></i>My notifications</h5>
                        <button class="btn btn-sm btn-outline-secondary" id="readAll"><i class="fas fa-check-double me-1"></i>Mark all as read</button>
                    </div>
                    <div id="list"><div class="loading"><i class="fas fa-spinner fa-spin"></i></div></div>
                </div>
            </div>
            <div class="col-lg-5 staff-only d-none">
                <div class="card-box" id="compose">
                    <h5><i class="fas fa-bullhorn me-2"></i>Send an announcement</h5>
                    <form id="sendForm">
                        <div class="mb-2"><label class="form-label" for="aud">To</label><select class="form-select" id="aud">
                            <option value="everyone">Everyone</option><option value="teachers">All teachers</option><option value="students">All students and parents</option><option value="staff">Admin and coordinators</option></select></div>
                        <div class="mb-2"><label class="form-label" for="title">Title</label><input class="form-control" id="title" maxlength="120" required></div>
                        <div class="mb-3"><label class="form-label" for="body">Message</label><textarea class="form-control" id="body" rows="4" maxlength="1000" required></textarea></div>
                        <button class="btn btn-brand"><i class="fas fa-paper-plane me-2"></i>Send</button>
                    </form>
                </div>
                <div class="card-box" id="outbox">
                    <h5><i class="fas fa-sms me-2"></i>Messages to parents</h5>
                    <p class="small text-muted">Absence alerts and fee reminders addressed to parents. In this demo they are recorded here instead of being sent through an SMS gateway.</p>
                    <div id="outboxList" style="max-height:420px;overflow-y:auto"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/notifications.js"></script>
</body>
</html>
