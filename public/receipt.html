<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTutor - Receipt</title>
    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <style>
        .receipt { max-width: 640px; margin: 30px auto; background: #fff; border-radius: 14px; box-shadow: 0 2px 14px rgba(0,0,0,.08); overflow: hidden; }
        .receipt-head { background: var(--brand-grad); color: #fff; padding: 24px 28px; }
        .receipt-body { padding: 24px 28px; }
        @media print { .receipt { box-shadow: none; margin: 0 auto; } .receipt-head { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
    </style>
</head>
<body>
    <div class="receipt" id="receipt"><div class="loading"><i class="fas fa-spinner fa-spin fa-2x"></i></div></div>
    <div class="text-center mb-4 no-print">
        <button class="btn btn-brand" onclick="window.print()"><i class="fas fa-print me-2"></i>Print / save as PDF</button>
        <a class="btn btn-outline-secondary" href="payments.html">Back to payments</a>
    </div>
    <script src="js/app.js"></script>
    <script>
        (async function () {
            const { esc, money } = App;
            const id = Number(new URLSearchParams(location.search).get('id'));
            const el = document.getElementById('receipt');
            try {
                const { payment: p, items } = await App.api('/payments/' + id + '/receipt');
                document.title = 'Receipt ' + p.receipt_no;
                el.innerHTML = `
                  <div class="receipt-head d-flex justify-content-between align-items-center">
                    <div><h4 class="mb-0"><i class="fas fa-graduation-cap me-2"></i>FutureMinds Tuition Center</h4><small>${esc(p.branch)} · SmartTutor</small></div>
                    <div class="text-end"><div class="fw-bold">RECEIPT</div><code class="text-white">${esc(p.receipt_no)}</code></div>
                  </div>
                  <div class="receipt-body">
                    <div class="row mb-3">
                      <div class="col-6"><small class="text-muted">Received from</small><br><strong>${esc(p.student)}</strong><br>${esc(p.code)} · Grade ${p.grade}${p.parent_name ? `<br><small>Parent: ${esc(p.parent_name)}</small>` : ''}</div>
                      <div class="col-6 text-end"><small class="text-muted">Date</small><br><strong>${App.fmtDate(p.paid_on)}</strong><br><small class="text-muted">Fee for</small><br><strong>${App.fmtMonth(p.month)}</strong></div>
                    </div>
                    <table class="table">
                      <thead><tr><th>Class</th><th class="text-end">Monthly fee</th></tr></thead>
                      <tbody>${items.map((i) => `<tr><td>${esc(i.subject)} - Grade ${i.grade}</td><td class="text-end">${money(i.monthly_fee)}</td></tr>`).join('')}</tbody>
                      <tfoot><tr><th>Amount paid (${esc(p.method)})</th><th class="text-end fs-5">${money(p.amount)}</th></tr></tfoot>
                    </table>
                    <p class="small text-muted mb-0">Recorded by ${esc(p.recorded_by_name || 'the front office')}. This receipt was generated by SmartTutor and is valid without a signature.</p>
                  </div>`;
            } catch (ex) {
                el.innerHTML = `<div class="p-4 text-center text-danger">${esc(ex.message)}</div>`;
            }
        })();
    </script>
</body>
</html>
