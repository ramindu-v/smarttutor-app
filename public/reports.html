<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTutor - Reports</title>
    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <main class="main-content">
        <div class="top-bar">
            <div class="flex-grow-1">
                <h4 id="pageTitle">Reports & Analytics</h4>
                <small class="text-muted" id="pageSubtitle">Attendance, revenue, workload and AI model performance</small>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mb-3 no-print flex-wrap">
            <button class="btn btn-outline-primary" onclick="window.print()"><i class="fas fa-print me-2"></i>Print / PDF</button>
            <button class="btn btn-outline-success" data-csv="/reports/students.csv"><i class="fas fa-file-csv me-2"></i>Students</button>
            <button class="btn btn-outline-success" data-csv="/attendance/export.csv"><i class="fas fa-file-csv me-2"></i>Attendance</button>
            <button class="btn btn-outline-success admin-only" data-csv="/payments/export.csv"><i class="fas fa-file-csv me-2"></i>Payments</button>
            <button class="btn btn-outline-danger" data-csv="/reports/at-risk.csv"><i class="fas fa-file-csv me-2"></i>At-risk students</button>
        </div>
        <div class="row">
            <div class="col-lg-8"><div class="card-box"><h5>Weekly attendance</h5><div class="chart-wrap"><canvas id="weekly"></canvas></div></div></div>
            <div class="col-lg-4"><div class="card-box"><h5>AI risk levels</h5><div class="chart-wrap"><canvas id="risk"></canvas></div><p class="small text-muted mt-2 mb-0" id="riskNote"></p></div></div>
        </div>
        <div class="row">
            <div class="col-lg-6"><div class="card-box"><h5>Attendance by subject</h5><div class="chart-wrap"><canvas id="subject"></canvas></div></div></div>
            <div class="col-lg-6 admin-only"><div class="card-box"><h5>Fee collection (last 6 months)</h5><div class="chart-wrap"><canvas id="revenue"></canvas></div></div></div>
        </div>
        <div class="row">
            <div class="col-lg-6"><div class="card-box"><h5>Teacher workload (classes per week)</h5><div class="chart-wrap" id="workloadWrap" style="height:640px"><canvas id="workload"></canvas></div></div></div>
            <div class="col-lg-6"><div class="card-box"><h5>Room utilisation</h5><div class="table-responsive"><table class="table table-sm">
                <thead><tr><th>Room</th><th>Seats</th><th>Classes / week</th><th>Slots used</th><th>Seats filled</th></tr></thead><tbody id="rooms"></tbody></table></div></div></div>
        </div>
        <div class="card-box" id="modelCard">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <h5 class="mb-0"><i class="fas fa-brain me-2"></i>Attendance prediction model</h5>
                <button class="btn btn-sm btn-outline-primary admin-only no-print" id="retrainBtn"><i class="fas fa-sync me-1"></i>Retrain now</button>
            </div>
            <div id="model" class="mt-3"></div>
        </div>
    </main>

    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="vendor/chart.js/chart.umd.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/reports.js"></script>
</body>
</html>
