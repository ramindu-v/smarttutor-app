<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTutor - Students</title>
    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <main class="main-content">
        <div class="top-bar">
            <div class="flex-grow-1">
                <h4 id="pageTitle">Student Management</h4>
                <small class="text-muted" id="pageSubtitle">Registrations, profiles and AI attendance predictions</small>
            </div>
        </div>
        <div class="card-box no-print">
            <div class="row g-2 align-items-end">
                <div class="col-md-4"><label class="form-label small" for="q">Search</label><input type="search" class="form-control" placeholder="Name or student ID" id="q"></div>
                <div class="col-6 col-md-2"><label class="form-label small" for="fGrade">Grade</label><select class="form-select" id="fGrade"><option value="">All grades</option></select></div>
                <div class="col-6 col-md-2"><label class="form-label small" for="fStatus">Status</label><select class="form-select" id="fStatus"><option value="">All</option><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
                <div class="col-6 col-md-2"><label class="form-label small" for="fSubject">Subject</label><select class="form-select" id="fSubject"><option value="">All subjects</option></select></div>
                <div class="col-6 col-md-2"><label class="form-label small" for="fRisk">AI risk</label><select class="form-select" id="fRisk"><option value="">Any</option><option value="high">High risk</option><option value="medium">Watch</option><option value="declining">Declining</option></select></div>
            </div>
        </div>

        <div class="row g-3 mb-4" id="summary"></div>

        <div class="card-box">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <h5 class="mb-0"><i class="fas fa-list me-2"></i>Student list <span class="text-muted fs-6" id="count"></span></h5>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-success btn-sm admin-only d-none" id="exportBtn"><i class="fas fa-file-csv me-1"></i>Export</button>
                    <button class="btn btn-brand admin-only d-none" id="addBtn"><i class="fas fa-plus me-2"></i>Add new student</button>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead><tr><th>Student</th><th>Grade</th><th>Subjects</th><th>Attendance</th><th>AI prediction</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
                    <tbody id="rows"><tr><td colspan="7" class="loading"><i class="fas fa-spinner fa-spin"></i></td></tr></tbody>
                </table>
            </div>
            <nav><ul class="pagination justify-content-center flex-wrap" id="pager"></ul></nav>
        </div>

        <!-- add / edit -->
        <div class="modal fade" id="editModal" tabindex="-1">
            <div class="modal-dialog modal-lg"><div class="modal-content">
                <form id="editForm" novalidate>
                    <div class="modal-header"><h5 class="modal-title" id="editTitle">Add new student</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label" for="eName">Full name *</label><input class="form-control" id="eName" required maxlength="100"></div>
                            <div class="col-md-3"><label class="form-label" for="eDob">Date of birth</label><input type="date" class="form-control" id="eDob"></div>
                            <div class="col-md-3"><label class="form-label" for="eStatus">Status</label><select class="form-select" id="eStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
                            <div class="col-md-3"><label class="form-label" for="eGrade">Grade *</label><select class="form-select" id="eGrade" required></select></div>
                            <div class="col-md-3"><label class="form-label" for="eBranch">Branch *</label><select class="form-select" id="eBranch" required></select></div>
                            <div class="col-md-6"><label class="form-label" for="eEmail">Email</label><input type="email" class="form-control" id="eEmail" placeholder="student@example.com"></div>
                            <div class="col-md-4"><label class="form-label" for="ePhone">Contact number</label><input type="tel" class="form-control" id="ePhone" placeholder="+94 77 123 4567"></div>
                            <div class="col-md-4"><label class="form-label" for="eParent">Parent / guardian</label><input class="form-control" id="eParent"></div>
                            <div class="col-md-4"><label class="form-label" for="eParentPhone">Parent contact</label><input type="tel" class="form-control" id="eParentPhone" placeholder="+94 71 234 5678"></div>
                            <div class="col-12"><label class="form-label">Classes</label><div id="eClasses" class="row g-1"></div></div>
                            <div class="col-12"><label class="form-label" for="eAddress">Address</label><textarea class="form-control" rows="2" id="eAddress"></textarea></div>
                            <div class="col-md-6" id="loginBox"><label class="form-label" for="ePassword">Portal password (optional)</label>
                                <input type="text" class="form-control" id="ePassword" minlength="6" placeholder="Creates a student / parent login">
                                <small class="text-muted">The username will be the student ID.</small></div>
                        </div>
                        <div class="alert alert-danger mt-3 d-none" id="editError"></div>
                    </div>
                    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-brand"><i class="fas fa-save me-2"></i>Save student</button></div>
                </form>
            </div></div>
        </div>

        <!-- profile -->
        <div class="modal fade" id="viewModal" tabindex="-1">
            <div class="modal-dialog modal-xl modal-dialog-scrollable"><div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="viewTitle">Student</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
                <div class="modal-body" id="viewBody"></div>
            </div></div>
        </div>
    </main>

    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="vendor/chart.js/chart.umd.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/students.js"></script>
</body>
</html>
